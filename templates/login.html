<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='dayone.css') }}">
        <meta charset="utf-8">
        <title>Log in / Sign up</title>
        <script src="{{ url_for('static', filename='dayone.js') }}" defer></script>
    </head>
    <body>
        <div class="container2">
            <h1 id="header">Log in to Notes</h1>
            <form method="POST">
                <input type="text" name="username" id="username" placeholder="Username" required>
                <input type="password" name="password" id="password" placeholder="Password" required>
                <button type="submit" class="button">Log in</button>
                <button type="button" class="button" id="sign_up">Sign up</button>
            </form>
            {% if error %}
                <p style="color: rgb(98, 0, 0);">{{ error }}</p>
            {% endif %}
        </div>
    </body>
</html>
